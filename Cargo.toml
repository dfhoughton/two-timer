[package]
name = "two_timer"
version = "3.0.0"
authors = ["dfhoughton <dfhoughton@gmail.com>"]
description = "parser for English time expressions"
homepage = "https://github.com/dfhoughton/two-timer"
repository = "https://github.com/dfhoughton/two-timer"
documentation = "https://docs.rs/two_timer"
keywords = ["time", "nlp", "parse"]
categories = ["date-and-time", "parsing"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[profile.release]
panic = "abort"

[dependencies]
pidgin = "0.6"
chrono = { version = "0.4.31", default-features = false, features = ["clock"] }
serde_json = { version = "1", optional = true }

[features]
small_grammar = []
# enables the `serializer` binary, which serializes the grammar with serde_json
serializer = ["dep:serde_json"]

[[bin]]
name = "serializer"
path = "src/bin/serializer.rs"
required-features = ["serializer"]
